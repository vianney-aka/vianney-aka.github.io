<style>
  :root{
    --accent:#13c06b; --accent-bright:#4ff0a0; --accent-deep:#02a753;
    --bg:#07090a; --bg-2:#0b0f0e; --surface:#0e1413; --surface-2:#141c1a;
    --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
    --text:#eaf2ee; --text-2:#9aa8a0; --text-3:#5f6d66;
    --danger:#ff5f56; --danger-soft:rgba(255,95,86,.12);
    --font-d:'Space Grotesk',sans-serif; --font-b:'Manrope',sans-serif; --font-m:'JetBrains Mono',monospace;
    --ease:cubic-bezier(.22,.61,.36,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:var(--font-b); font-size:15px; -webkit-font-smoothing:antialiased; }
  body::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(800px 500px at 90% -10%, rgba(19,192,107,.14), transparent 60%); }
  ::selection{ background:var(--accent); color:#04140c; }
  ::-webkit-scrollbar{ width:10px; height:10px; } ::-webkit-scrollbar-track{ background:var(--bg); }
  ::-webkit-scrollbar-thumb{ background:#1d2622; border-radius:99px; border:2px solid var(--bg); }
  h1,h2,h3,h4{ font-family:var(--font-d); font-weight:600; letter-spacing:-.01em; }
  a{ color:var(--accent-bright); }
  #root{ position:relative; z-index:1; }

  /* ---- Auth screens ---- */
  .auth-wrap{ min-height:100vh; display:grid; place-items:center; padding:24px; }
  .auth-card{ width:100%; max-width:420px; background:var(--bg-2); border:1px solid var(--line);
    border-radius:20px; padding:40px; box-shadow:0 30px 80px -30px #000; }
  .auth-logo{ display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .auth-logo svg{ width:44px; height:44px; flex:0 0 44px; }
  .auth-logo .t{ font-family:var(--font-d); font-weight:600; font-size:18px; line-height:1.1; white-space:nowrap; }
  .auth-logo .s{ font-family:var(--font-m); font-size:10.5px; color:var(--text-2); letter-spacing:.16em; text-transform:uppercase; }
  .auth-card h1{ font-size:24px; margin-bottom:8px; }
  .auth-card .lead{ color:var(--text-2); font-size:14px; margin-bottom:26px; }
  .auth-err{ background:var(--danger-soft); border:1px solid rgba(255,95,86,.3); color:#ffb4ae;
    border-radius:10px; padding:11px 14px; font-size:13px; margin-bottom:16px; }

  /* ---- Inputs ---- */
  label.fld{ display:block; margin-bottom:16px; }
  label.fld > span{ display:block; font-family:var(--font-m); font-size:11px; color:var(--text-2);
    letter-spacing:.1em; text-transform:uppercase; margin-bottom:7px; }
  input, textarea, select{ width:100%; background:var(--surface); border:1px solid var(--line);
    border-radius:10px; padding:12px 14px; color:var(--text); font-family:var(--font-b); font-size:14px;
    transition:border-color .2s, box-shadow .2s; }
  textarea{ resize:vertical; line-height:1.5; }
  input:focus, textarea:focus, select:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(19,192,107,.14); }

  .btn{ font-family:var(--font-b); font-weight:600; font-size:14px; border-radius:10px; cursor:pointer;
    border:1px solid transparent; padding:11px 18px; display:inline-flex; align-items:center; gap:8px;
    transition:background .2s, color .2s, border-color .2s, transform .15s; text-decoration:none; }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--accent); color:#04140c; } .btn-primary:hover{ background:var(--accent-bright); }
  .btn-ghost{ background:transparent; color:var(--text); border-color:var(--line-2); } .btn-ghost:hover{ border-color:var(--accent); color:var(--accent-bright); }
  .btn-danger{ background:transparent; color:#ffb4ae; border-color:rgba(255,95,86,.35); } .btn-danger:hover{ background:var(--danger-soft); }
  .btn-sm{ padding:7px 12px; font-size:13px; }
  .btn-block{ width:100%; justify-content:center; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }

  /* ---- Layout ---- */
  .shell{ display:grid; grid-template-columns:264px 1fr; min-height:100vh; }
  .sidebar{ border-right:1px solid var(--line); padding:24px 18px; display:flex; flex-direction:column; gap:6px;
    position:sticky; top:0; height:100vh; overflow-y:auto; }
  .sb-brand{ display:flex; align-items:center; gap:11px; padding:6px 10px 20px; }
  .sb-brand svg{ width:38px; height:38px; flex:0 0 38px; }
  .sb-brand .t{ font-family:var(--font-d); font-weight:600; font-size:16px; line-height:1.1; white-space:nowrap; }
  .sb-brand .s{ font-family:var(--font-m); font-size:9.5px; color:var(--text-3); letter-spacing:.14em; text-transform:uppercase; }
  .nav-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 14px;
    border-radius:10px; cursor:pointer; color:var(--text-2); font-size:14.5px; font-weight:500;
    border:1px solid transparent; transition:background .18s, color .18s; }
  .nav-item:hover{ background:rgba(255,255,255,.04); color:var(--text); }
  .nav-item.active{ background:var(--surface); color:var(--text); border-color:var(--line); }
  .nav-item .ic{ width:18px; text-align:center; opacity:.8; }
  .nav-item .lbl{ flex:1; }
  .badge-count{ background:var(--accent); color:#04140c; font-family:var(--font-m); font-size:11px; font-weight:600;
    border-radius:99px; padding:2px 8px; min-width:22px; text-align:center; }
  .sb-spacer{ flex:1; }
  .sb-foot{ border-top:1px solid var(--line); padding-top:14px; display:flex; flex-direction:column; gap:6px; }

  .main{ padding:0; min-width:0; }
  .topbar{ position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:18px 32px; background:rgba(7,9,10,.8); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
  .topbar h2{ font-size:20px; }
  .topbar .right{ display:flex; align-items:center; gap:10px; }
  .save-state{ font-family:var(--font-m); font-size:12px; color:var(--text-3); }
  .save-state.ok{ color:var(--accent-bright); }
  .content{ padding:28px 32px 80px; max-width:920px; }

  .card{ background:var(--bg-2); border:1px solid var(--line); border-radius:16px; padding:24px; margin-bottom:18px; }
  .card-h{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .card-h h3{ font-size:16px; }
  .card-h .meta{ font-family:var(--font-m); font-size:12px; color:var(--text-3); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .hint{ font-size:12.5px; color:var(--text-3); margin-top:-6px; margin-bottom:14px; }
  .item-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .item-head .n{ font-family:var(--font-m); font-size:12px; color:var(--accent); }
  .item-tools{ display:flex; gap:6px; }
  .icon-btn{ width:30px; height:30px; border-radius:8px; border:1px solid var(--line-2); background:transparent;
    color:var(--text-2); cursor:pointer; display:grid; place-items:center; font-size:14px; transition:.18s; }
  .icon-btn:hover{ color:var(--text); border-color:var(--accent); }
  .icon-btn:disabled{ opacity:.3; cursor:not-allowed; }
  .icon-btn.del:hover{ color:#ffb4ae; border-color:rgba(255,95,86,.4); }

  /* ---- Messages ---- */
  .msg-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .seg{ display:flex; border:1px solid var(--line-2); border-radius:99px; overflow:hidden; }
  .seg button{ background:transparent; border:0; color:var(--text-2); padding:8px 16px; cursor:pointer; font-size:13px; font-family:var(--font-b); }
  .seg button.active{ background:var(--surface); color:var(--text); }
  .msg{ background:var(--bg-2); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:12px; transition:border-color .2s; }
  .msg.unread{ border-color:rgba(19,192,107,.45); }
  .msg-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; cursor:pointer; }
  .msg-who{ display:flex; align-items:center; gap:12px; min-width:0; }
  .msg-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex:0 0 auto; }
  .msg-dot.read{ background:var(--text-3); }
  .msg-name{ font-weight:600; }
  .msg-email{ color:var(--text-3); font-size:13px; font-family:var(--font-m); }
  .msg-date{ font-family:var(--font-m); font-size:12px; color:var(--text-3); white-space:nowrap; }
  .msg-body{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line); color:var(--text-2); line-height:1.6; white-space:pre-wrap; }
  .msg-actions{ display:flex; gap:8px; margin-top:16px; }
  .pill{ font-family:var(--font-m); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3);
    border:1px solid var(--line); border-radius:99px; padding:3px 8px; }
  .empty{ text-align:center; padding:70px 20px; color:var(--text-3); }
  .empty .big{ font-size:42px; margin-bottom:14px; opacity:.5; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120%);
    background:var(--surface); border:1px solid var(--accent); color:var(--text); padding:13px 22px; border-radius:12px;
    font-size:14px; z-index:100; transition:transform .35s var(--ease); box-shadow:0 16px 40px -16px #000; }
  .toast.show{ transform:translateX(-50%) translateY(0); }

  @media (max-width:820px){
    .shell{ grid-template-columns:1fr; }
    .sidebar{ position:static; height:auto; flex-direction:row; flex-wrap:wrap; align-items:center; }
    .sb-brand{ padding:6px 10px; width:100%; }
    .sb-spacer{ display:none; } .sb-foot{ border-top:0; padding-top:0; flex-direction:row; }
    .row2{ grid-template-columns:1fr; }
    .content{ padding:20px; }
    .topbar{ padding:14px 20px; }
  }
</style>
</head>

  const clone = (o) => JSON.parse(JSON.stringify(o));
  function read(key, fallback) {
    try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch (e) { return fallback; }
  }
  function write(key, val) {
    try { localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch (e) { return false; }
  }

  function get() {
    const stored = read(KEY_CONTENT, null);
    if (!stored) return clone(DEFAULT_CONTENT);
    const base = clone(DEFAULT_CONTENT);
    Object.keys(stored).forEach(k => { base[k] = stored[k]; });
    return base;
  }
  function save(content) { return write(KEY_CONTENT, content); }
  function reset() { try { localStorage.removeItem(KEY_CONTENT); } catch (e) {} }

  function getMessages() { return read(KEY_MESSAGES, []); }
  function addMessage(msg) {
    const list = getMessages();
    list.unshift({
      id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      name: msg.name || '', email: msg.email || '', message: msg.message || '',
      lang: msg.lang || 'fr', date: new Date().toISOString(), read: false
    });
    write(KEY_MESSAGES, list);
  }
  function deleteMessage(id) { write(KEY_MESSAGES, getMessages().filter(m => m.id !== id)); }
  function setRead(id, val) {
    const list = getMessages(); const m = list.find(x => x.id === id);
    if (m) { m.read = val !== false; write(KEY_MESSAGES, list); }
  }
  function markAllRead() { const l = getMessages(); l.forEach(m => m.read = true); write(KEY_MESSAGES, l); }
  function unreadCount() { return getMessages().filter(m => !m.read).length; }

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  const Auth = {
    isSetup()  { return !!localStorage.getItem(KEY_HASH); },
    async setPassword(pw) { localStorage.setItem(KEY_HASH, await sha256(pw)); },
    async check(pw) { return (await sha256(pw)) === localStorage.getItem(KEY_HASH); },
    login()    { try { sessionStorage.setItem(KEY_SESSION, '1'); } catch (e) {} },
    logout()   { try { sessionStorage.removeItem(KEY_SESSION); } catch (e) {} },
    isLoggedIn(){ try { return sessionStorage.getItem(KEY_SESSION) === '1'; } catch (e) { return false; } }
  };

  global.VAContent = {
    DEFAULT_CONTENT, get, save, reset,
    getMessages, addMessage, deleteMessage, setRead, markAllRead, unreadCount,
    Auth
  };
})(window);
</script>

/* ---- UI helpers ---- */
function Field({ label, value, onChange, type = 'text', placeholder, area, rows = 3, mono }) {
  return (
    <label className="fld">
      <span>{label}</span>
      {area
        ? <textarea rows={rows} value={value || ''} placeholder={placeholder} onChange={e => onChange(e.target.value)} style={mono ? { fontFamily: 'var(--font-m)', fontSize: 13 } : null} />
        : <input type={type} value={value || ''} placeholder={placeholder} onChange={e => onChange(e.target.value)} />}
    </label>
  );
}

function CsvField({ label, value, onChange, hint }) {
  return (
    <label className="fld">
      <span>{label}</span>
      <input value={(value || []).join(', ')} onChange={e => onChange(e.target.value.split(',').map(s => s.trim()).filter(Boolean))} />
      {hint && <div className="hint" style={{ marginTop: 6 }}>{hint}</div>}
    </label>
  );
}

function ItemCard({ index, total, title, onMove, onRemove, children }) {

          <button className="icon-btn" disabled={index === 0} onClick={() => onMove(index, -1)} title="Monter">↑</button>
          <button className="icon-btn" disabled={index === total - 1} onClick={() => onMove(index, 1)} title="Descendre">↓</button>
          <button className="icon-btn del" onClick={() => onRemove(index)} title="Supprimer">✕</button>

/* ---- Auth ---- */
function AuthScreen({ onAuthed }) {
  const [setup, setSetup] = useState(!VA.Auth.isSetup());
  const [pw, setPw] = useState('');
  const [pw2, setPw2] = useState('');
  const [err, setErr] = useState('');
  const [busy, setBusy] = useState(false);

  async function submit(e) {
    e.preventDefault(); setErr(''); setBusy(true);
    try {
      if (setup) {
        if (pw.length < 6) { setErr('Le mot de passe doit faire au moins 6 caractères.'); setBusy(false); return; }
        if (pw !== pw2) { setErr('Les mots de passe ne correspondent pas.'); setBusy(false); return; }
        await VA.Auth.setPassword(pw); VA.Auth.login(); onAuthed();
      } else {
        const ok = await VA.Auth.check(pw);
        if (!ok) { setErr('Mot de passe incorrect.'); setBusy(false); return; }
        VA.Auth.login(); onAuthed();
      }
    } catch (e2) { setErr('Erreur : ' + e2.message); setBusy(false); }
  }

  return (
    <div className="auth-wrap">
      <form className="auth-card" onSubmit={submit}>
        <div className="auth-logo">
          <LogoMark size={44} />
          <div><div className="t">Vianney Aka</div><div className="s">Espace admin</div></div>
        </div>
        <h1>{setup ? 'Créer votre accès' : 'Connexion'}</h1>
        <p className="lead">{setup
          ? 'Première connexion : définissez un mot de passe pour protéger votre back-office.'
          : 'Entrez votre mot de passe pour accéder au tableau de bord.'}</p>
        {err && <div className="auth-err">{err}</div>}
        <Field label="Mot de passe" type="password" value={pw} onChange={setPw} placeholder="••••••••" />
        {setup && <Field label="Confirmer le mot de passe" type="password" value={pw2} onChange={setPw2} placeholder="••••••••" />}
        <button className="btn btn-primary btn-block" disabled={busy} style={{ marginTop: 8 }}>
          {busy ? '…' : (setup ? 'Créer l’accès' : 'Se connecter')}
        </button>
        <p className="hint" style={{ marginTop: 18, textAlign: 'center' }}>
          🔒 Mot de passe chiffré (SHA-256) et stocké dans ce navigateur.
        </p>
      </form>
    </div>
  );
}

/* ---- Messages ---- */
function MessagesPanel({ messages, reload }) {
  const [filter, setFilter] = useState('all');
  const [open, setOpen] = useState(null);
  const list = messages.filter(m => filter === 'all' ? true : filter === 'unread' ? !m.read : m.read);
  const fmt = (iso) => { try { return new Date(iso).toLocaleString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return iso; } };

  function toggle(m) {
    const isOpen = open === m.id;
    setOpen(isOpen ? null : m.id);
    if (!isOpen && !m.read) { VA.setRead(m.id, true); reload(); }
  }

  return (
    <div>
      <div className="msg-toolbar">
        <div className="seg">
          {[['all', 'Tous'], ['unread', 'Non lus'], ['read', 'Lus']].map(([k, l]) =>
            <button key={k} className={filter === k ? 'active' : ''} onClick={() => setFilter(k)}>{l}</button>)}
        </div>
        <button className="btn btn-ghost btn-sm" onClick={() => { VA.markAllRead(); reload(); }}>Tout marquer lu</button>
      </div>
      {list.length === 0
        ? <div className="empty"><div className="big">✉</div>Aucun message {filter === 'unread' ? 'non lu' : filter === 'read' ? 'lu' : ''} pour le moment.</div>
        : list.map(m => (
          <div key={m.id} className={'msg' + (m.read ? '' : ' unread')}>
            <div className="msg-top" onClick={() => toggle(m)}>
              <div className="msg-who">
                <span className={'msg-dot' + (m.read ? ' read' : '')}></span>
                <div style={{ minWidth: 0 }}>
                  <div className="msg-name">{m.name || 'Sans nom'} <span className="pill">{(m.lang || 'fr').toUpperCase()}</span></div>
                  <div className="msg-email">{m.email}</div>
                </div>
              </div>
              <div className="msg-date">{fmt(m.date)}</div>
            </div>
            {open === m.id && (
              <>
                <div className="msg-body">{m.message}</div>
                <div className="msg-actions">
                  <a className="btn btn-primary btn-sm" href={'mailto:' + m.email + '?subject=' + encodeURIComponent('Re: votre message')}>Répondre</a>
                  <button className="btn btn-ghost btn-sm" onClick={() => { VA.setRead(m.id, !m.read); reload(); }}>{m.read ? 'Marquer non lu' : 'Marquer lu'}</button>
                  <button className="btn btn-danger btn-sm" onClick={() => { if (confirm('Supprimer ce message ?')) { VA.deleteMessage(m.id); reload(); } }}>Supprimer</button>
                </div>
              </>
            )}
          </div>
        ))}
    </div>
  );
}

function CertsEditor({ c, patch }) {
  const move = (i, dir) => patch(d => { const a = d.certs; const j = i + dir; [a[i], a[j]] = [a[j], a[i]]; });
  const rm   = (i) => patch(d => d.certs.splice(i, 1));
  const add  = () => patch(d => d.certs.push({ badge: 'NEW', titleFr: 'Nouvelle certification', titleEn: 'New certification', issuer: '' }));
  return (
    <div>
      <div className="card-h" style={{ padding: '0 4px' }}><h3>Formation & Certifications</h3><span className="meta">{c.certs.length} éléments</span></div>
      {c.certs.map((x, i) => (
        <ItemCard key={i} index={i} total={c.certs.length} title={x.titleFr || ('Certif. ' + (i + 1))} onMove={move} onRemove={rm}>
          <div className="row2" style={{ gridTemplateColumns: '120px 1fr' }}>
            <Field label="Badge (3 lettres)" value={x.badge} onChange={v => patch(d => d.certs[i].badge = v)} />
            <Field label="Émetteur / année" value={x.issuer} onChange={v => patch(d => d.certs[i].issuer = v)} />
          </div>
          <div className="row2">
            <Field label="Intitulé · FR" value={x.titleFr} onChange={v => patch(d => d.certs[i].titleFr = v)} />
            <Field label="Intitulé · EN" value={x.titleEn} onChange={v => patch(d => d.certs[i].titleEn = v)} />
          </div>
        </ItemCard>
      ))}
      <AddBtn onClick={add} label="Ajouter une certification" />
    </div>
  );
}

function ServicesEditor({ c, patch }) {
  const ICONS = ['code', 'lms', 'consult', 'mobile', 'cloud', 'design'];
  const move = (i, dir) => patch(d => { const a = d.services; const j = i + dir; [a[i], a[j]] = [a[j], a[i]]; });
  const rm   = (i) => patch(d => d.services.splice(i, 1));
  const add  = () => patch(d => d.services.push({ icon: 'code', titleFr: 'Nouveau service', titleEn: 'New service', descFr: '', descEn: '' }));
  return (
    <div>
      <div className="card-h" style={{ padding: '0 4px' }}><h3>Services</h3><span className="meta">{c.services.length} services</span></div>
      {c.services.map((s, i) => (
        <ItemCard key={i} index={i} total={c.services.length} title={s.titleFr || ('Service ' + (i + 1))} onMove={move} onRemove={rm}>
          <label className="fld"><span>Icône</span>
            <select value={s.icon} onChange={e => patch(d => d.services[i].icon = e.target.value)}>
              {ICONS.map(ic => <option key={ic} value={ic}>{ic}</option>)}
            </select>
          </label>
          <div className="row2">
            <Field label="Titre · FR" value={s.titleFr} onChange={v => patch(d => d.services[i].titleFr = v)} />
            <Field label="Titre · EN" value={s.titleEn} onChange={v => patch(d => d.services[i].titleEn = v)} />
          </div>
          <div className="row2">
            <Field area label="Description · FR" value={s.descFr} onChange={v => patch(d => d.services[i].descFr = v)} />
            <Field area label="Description · EN" value={s.descEn} onChange={v => patch(d => d.services[i].descEn = v)} />
          </div>
        </ItemCard>
      ))}
      <AddBtn onClick={add} label="Ajouter un service" />
    </div>
  );
}

function ContactEditor({ c, patch }) {
  return (
    <div className="card">
      <div className="card-h"><h3>Coordonnées</h3></div>
      <Field label="Email" value={c.contact.email} onChange={v => patch(d => d.contact.email = v)} />
      <div className="row2">
        <Field label="Téléphone (lien tel:)" value={c.contact.phone} onChange={v => patch(d => d.contact.phone = v)} />
        <Field label="Téléphone (affiché)" value={c.contact.phoneDisplay} onChange={v => patch(d => d.contact.phoneDisplay = v)} />
      </div>
      <div className="row2">
        <Field label="LinkedIn (URL)" value={c.contact.linkedin} onChange={v => patch(d => d.contact.linkedin = v)} />
        <Field label="LinkedIn (affiché)" value={c.contact.linkedinDisplay} onChange={v => patch(d => d.contact.linkedinDisplay = v)} />
      </div>
      <div className="row2">
        <Field label="GitHub (URL)" value={c.contact.github} onChange={v => patch(d => d.contact.github = v)} />
        <Field label="GitHub (affiché)" value={c.contact.githubDisplay} onChange={v => patch(d => d.contact.githubDisplay = v)} />
      </div>
    </div>
  );
}

/* ---- Paramètres ---- */
function SettingsPanel({ onReset, onLogout, toast }) {
  const [cur, setCur] = useState('');
  const [n1, setN1]   = useState('');
  const [n2, setN2]   = useState('');
  const [err, setErr] = useState('');

  async function changePw(e) {
    e.preventDefault(); setErr('');
    if (!(await VA.Auth.check(cur))) { setErr('Mot de passe actuel incorrect.'); return; }
    if (n1.length < 6) { setErr('Le nouveau mot de passe doit faire au moins 6 caractères.'); return; }
    if (n1 !== n2) { setErr('Les nouveaux mots de passe ne correspondent pas.'); return; }
    await VA.Auth.setPassword(n1); setCur(''); setN1(''); setN2(''); toast('Mot de passe mis à jour ✓');
  }

  function dl(content, filename, type) {
    const blob = new Blob([content], { type });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = filename; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }

  function exportData() {
    dl(JSON.stringify({ content: VA.get(), messages: VA.getMessages() }, null, 2),
      'portfolio-backup-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json');
  }

  function exportExcel() {
    if (!window.XLSX) { toast('Librairie Excel non chargee'); return; }
    const c = VA.get(); const msgs = VA.getMessages();
    const wb = window.XLSX.utils.book_new();
    const hdr = (ws, cols) => { ws['!cols'] = cols.map(w => ({ wch: w })); };
    const wsM = window.XLSX.utils.aoa_to_sheet([
      ['Date', 'Nom', 'Email', 'Langue', 'Lu', 'Message'],
      ...msgs.map(m => [new Date(m.date).toLocaleString('fr-FR'), m.name||'', m.email, (m.lang||'fr').toUpperCase(), m.read?'Oui':'Non', m.message])
    ]);
    hdr(wsM, [19,20,30,8,6,80]); window.XLSX.utils.book_append_sheet(wb, wsM, 'Messages');
    const wsP = window.XLSX.utils.aoa_to_sheet([
      ['Titre FR','Titre EN','Badge','Periode FR','Description FR','Tags','Liens'],
      ...c.projects.map(p => [p.titleFr,p.titleEn,p.tagFr,p.periodFr,p.descFr,(p.tags||[]).join(', '),(p.links||[]).map(l=>l.url).join(' | ')])
    ]);
    hdr(wsP, [26,26,18,26,55,35,35]); window.XLSX.utils.book_append_sheet(wb, wsP, 'Projets');
    const wsX = window.XLSX.utils.aoa_to_sheet([
      ['Periode FR','Poste FR','Organisation','Description FR'],
      ...c.experience.map(x => [x.dateFr,x.titleFr,x.org,x.descFr])
    ]);
    hdr(wsX, [22,28,30,60]); window.XLSX.utils.book_append_sheet(wb, wsX, 'Experiences');
    const wsS = window.XLSX.utils.aoa_to_sheet([
      ['Titre FR','Titre EN','Description FR','Technologies'],
      ...c.skills.map(s => [s.titleFr,s.titleEn,s.descFr,(s.chips||[]).join(', ')])
    ]);
    hdr(wsS, [28,28,38,55]); window.XLSX.utils.book_append_sheet(wb, wsS, 'Competences');
    const wsC = window.XLSX.utils.aoa_to_sheet([
      ['Badge','Intitule FR','Intitule EN','Emetteur'],
      ...c.certs.map(x => [x.badge,x.titleFr,x.titleEn,x.issuer])
    ]);
    hdr(wsC, [8,44,44,30]); window.XLSX.utils.book_append_sheet(wb, wsC, 'Certifications');
    const wsSv = window.XLSX.utils.aoa_to_sheet([
      ['Icone','Titre FR','Titre EN','Description FR','Description EN'],
      ...c.services.map(s => [s.icon,s.titleFr,s.titleEn,s.descFr,s.descEn])
    ]);
    hdr(wsSv, [10,30,30,55,55]); window.XLSX.utils.book_append_sheet(wb, wsSv, 'Services');
    const ct = c.contact;
    const wsCt = window.XLSX.utils.aoa_to_sheet([
      ['Champ','Valeur'],['Email',ct.email],['Telephone',ct.phoneDisplay],
      ['LinkedIn URL',ct.linkedin],['LinkedIn affiche',ct.linkedinDisplay],
      ['GitHub URL',ct.github],['GitHub affiche',ct.githubDisplay]
    ]);
    hdr(wsCt, [20,50]); window.XLSX.utils.book_append_sheet(wb, wsCt, 'Contact');
    window.XLSX.writeFile(wb, 'portfolio-' + new Date().toISOString().slice(0,10) + '.xlsx');
    toast('Export Excel telecharge');
  }

  function exportMarkdown() {
    const c = VA.get(); const msgs = VA.getMessages();
    const today = new Date().toLocaleDateString('fr-FR');
    const esc = s => (s||'').replace(/\|/g, '\\|').replace(/\n/g,' ');
    const md = [
      '# Vianney Aka - Portfolio', '', '> Export du ' + today, '', '---', '',
      '## Messages recus (' + msgs.length + ')', '',
      '| Date | Nom | Email | Lu | Apercu |',
      '|------|-----|-------|:--:|--------|',
      ...msgs.map(m => '| ' + new Date(m.date).toLocaleString('fr-FR') + ' | ' + esc(m.name||'—') + ' | ' + esc(m.email) + ' | ' + (m.read?'✓':'○') + ' | ' + esc((m.message||'').slice(0,80)) + ((m.message||'').length>80?'…':'') + ' |'),
      '', '---', '', '## Projets', '',
      ...c.projects.flatMap(p => [
        '### ' + p.titleFr, '', '**' + p.tagFr + '** · ' + p.periodFr, '',
        p.descFr, '',
        p.tags&&p.tags.length ? '**Stack :** ' + p.tags.join(' · ') : '',
        p.links&&p.links.length ? p.links.map(l=>'['+l.labelFr+']('+l.url+')').join(' · ') : '',
        ''
      ]),
      '---', '', '## Experiences', '',
      ...c.experience.flatMap(x => ['### ' + x.titleFr, '**' + x.org + '** · ' + x.dateFr, '', x.descFr, '']),
      '---', '', '## Certifications', '',
      '| Badge | Intitule | Emetteur |', '|-------|----------|----------|',
      ...c.certs.map(x => '| **' + x.badge + '** | ' + x.titleFr + ' | ' + x.issuer + ' |'),
      '', '---', '', '## Competences', '',
      ...c.skills.flatMap(s => ['### ' + s.titleFr, s.descFr, '', s.chips&&s.chips.length ? s.chips.map(ch=>''+ch+'').join(' · ') : '', '']),
      '---', '', '## Contact', '',
      '- **Email :** ' + c.contact.email,
      '- **Tel :** ' + c.contact.phoneDisplay,
      '- **LinkedIn :** [' + c.contact.linkedinDisplay + '](' + c.contact.linkedin + ')',
      '- **GitHub :** [' + c.contact.githubDisplay + '](' + c.contact.github + ')',
    ].join('\n');
    dl(md, 'portfolio-' + new Date().toISOString().slice(0,10) + '.md', 'text/markdown');
    toast('Export Markdown telecharge');
  }

    function importData(e) {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (o.content) VA.save(o.content);
        if (o.messages) localStorage.setItem('va_messages_v1', JSON.stringify(o.messages));
        toast('Import réussi — rechargement…');
        setTimeout(() => location.reload(), 800);
      } catch (err) { toast('Fichier invalide'); }
    };
    r.readAsText(f);
  }

  return (
    <div>
      <form className="card" onSubmit={changePw}>
        <div className="card-h"><h3>Changer le mot de passe</h3></div>
        {err && <div className="auth-err">{err}</div>}
        <Field label="Mot de passe actuel" type="password" value={cur} onChange={setCur} />
        <div className="row2">
          <Field label="Nouveau" type="password" value={n1} onChange={setN1} />
          <Field label="Confirmer" type="password" value={n2} onChange={setN2} />
        </div>
        <button className="btn btn-primary">Mettre à jour</button>
      </form>

      <div className="card">
        <div className="card-h"><h3>Sauvegarde des données</h3></div>
        <div className="hint">Le contenu et les messages sont stockés dans ce navigateur. Exportez régulièrement une sauvegarde.</div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button className="btn btn-ghost" onClick={exportData}>⬇ JSON</button>
          <button className="btn btn-ghost" onClick={exportExcel}>⬇ Excel (.xlsx)</button>
          <button className="btn btn-ghost" onClick={exportMarkdown}>⬇ Markdown (.md)</button>
          <label className="btn btn-ghost" style={{ cursor: 'pointer' }}>⬆ Importer
            <input type="file" accept="application/json" style={{ display: 'none' }} onChange={importData} />
          </label>
        </div>
      </div>

      <div className="card">
        <div className="card-h"><h3>Zone sensible</h3></div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap' }}>
          <button className="btn btn-danger" onClick={onReset}>Réinitialiser le contenu (CV par défaut)</button>
          <button className="btn btn-ghost" onClick={onLogout}>Se déconnecter</button>
        </div>
      </div>
    </div>
  );
}

/* ---- Dashboard ---- */
const TABS = [
  { id: 'messages',   label: 'Messages',      ic: '✉' },
  { id: 'hero',       label: 'Accueil',        ic: '◆' },
  { id: 'about',      label: 'À propos',       ic: '☰' },
  { id: 'skills',     label: 'Compétences',    ic: '▣' },
  { id: 'projects',   label: 'Projets',        ic: '❏' },
  { id: 'experience', label: 'Parcours',       ic: '≡' },
  { id: 'certs',      label: 'Certifications', ic: '✦' },
  { id: 'services',   label: 'Services',       ic: '❖' },
  { id: 'contact',    label: 'Contact',        ic: '✆' },
  { id: 'settings',   label: 'Paramètres',     ic: '⚙' },
];

function Dashboard() {
  const [content,  setContent]  = useState(() => VA.get());
  const [messages, setMessages] = useState(() => VA.getMessages());
  const [tab,      setTab]      = useState('messages');
  const [saved,    setSaved]    = useState('');
  const [toastMsg, setToastMsg] = useState('');
  const toastTimer = useRef(null);

  const reload = useCallback(() => setMessages(VA.getMessages()), []);
  const toast  = useCallback((msg) => {
    setToastMsg(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMsg(''), 2600);
  }, []);

  const patch = useCallback((fn) => {
    setContent(prev => {
      const draft = JSON.parse(JSON.stringify(prev));
      fn(draft);
      VA.save(draft);
      setSaved(new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }));
      return draft;
    });
  }, []);

  useEffect(() => { const t = setInterval(reload, 4000); return () => clearInterval(t); }, [reload]);

  function resetContent() {
    if (!confirm('Réinitialiser tout le contenu aux valeurs du CV ? Vos modifications de contenu seront perdues (les messages sont conservés).')) return;
    VA.reset(); setContent(VA.get()); toast('Contenu réinitialisé ✓');
  }
  function logout() { VA.Auth.logout(); location.reload(); }

  const unread = messages.filter(m => !m.read).length;
  const cur    = TABS.find(t => t.id === tab);

  return (
    <div className="shell">
      <aside className="sidebar">
        <div className="sb-brand">
          <LogoMark size={38} />
          <div><div className="t">Vianney Aka</div><div className="s">Back-office</div></div>
        </div>
        {TABS.map(t => (
          <div key={t.id} className={'nav-item' + (tab === t.id ? ' active' : '')} onClick={() => setTab(t.id)}>
            <span className="ic">{t.ic}</span>
            <span className="lbl">{t.label}</span>
            {t.id === 'messages' && unread > 0 && <span className="badge-count">{unread}</span>}
          </div>
        ))}
        <div className="sb-spacer"></div>
        <div className="sb-foot">
          <a className="btn btn-ghost btn-sm btn-block" href="index.html" target="_blank" rel="noopener">↗ Voir le site</a>
          <button className="btn btn-ghost btn-sm btn-block" onClick={logout}>Se déconnecter</button>
        </div>
      </aside>

      <main className="main">
        <div className="topbar">
          <h2>{cur.label}</h2>
          <div className="right">
            {tab !== 'messages' && tab !== 'settings' &&
              <span className={'save-state' + (saved ? ' ok' : '')}>{saved ? 'Sauvegardé à ' + saved : 'Sauvegarde automatique'}</span>}
            <a className="btn btn-primary btn-sm" href="index.html" target="_blank" rel="noopener">Voir le site ↗</a>
          </div>
        </div>
        <div className="content">
          {tab === 'messages'   && <MessagesPanel   messages={messages} reload={reload} />}
          {tab === 'hero'       && <HeroEditor       c={content} patch={patch} />}
          {tab === 'about'      && <AboutEditor      c={content} patch={patch} />}
          {tab === 'skills'     && <SkillsEditor     c={content} patch={patch} />}
          {tab === 'projects'   && <ProjectsEditor   c={content} patch={patch} />}
          {tab === 'experience' && <ExperienceEditor c={content} patch={patch} />}
          {tab === 'certs'      && <CertsEditor      c={content} patch={patch} />}
          {tab === 'services'   && <ServicesEditor   c={content} patch={patch} />}
          {tab === 'contact'    && <ContactEditor    c={content} patch={patch} />}
          {tab === 'settings'   && <SettingsPanel    onReset={resetContent} onLogout={logout} toast={toast} />}
        </div>
      </main>

      <div className={'toast' + (toastMsg ? ' show' : '')}>{toastMsg}</div>
    </div>
  );
}

function App() {
  const [authed, setAuthed] = useState(VA.Auth.isLoggedIn());
  return authed ? <Dashboard /> : <AuthScreen onAuthed={() => setAuthed(true)} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
